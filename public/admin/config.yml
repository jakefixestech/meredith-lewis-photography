backend:
  name: github
  repo: jakefixestech/meredith-lewis-photography
  branch: main
  base_url: https://meredithlewisphotography.com
  auth_endpoint: /api/auth

media_folder: "src/assets/uploads"
public_folder: "/src/assets/uploads"

collections:
  - name: "homepage"
    label: "Home Page"
    files:
      - name: "content"
        label: "Home Page Content"
        file: "src/content/homepage.json"
        editor:
          preview: false
        fields:
          # ---------- HERO ----------
          - { name: "hero_image", label: "Hero Image (top banner)", widget: "image" }
          - { name: "hero_image_alt", label: "Hero Image — description for screen readers", widget: "string" }
          - { name: "hero_heading", label: "Hero Heading", widget: "text" }

          # ---------- ABOUT / WELCOME ----------
          - { name: "about_eyebrow", label: "About — small text above heading", widget: "string" }
          - { name: "about_heading", label: "About — Heading", widget: "string" }
          - { name: "about_photo", label: "About — Your Photo", widget: "image" }
          - { name: "about_photo_alt", label: "About Photo — description for screen readers", widget: "string" }
          - name: "about_paragraphs"
            label: "About — Paragraphs"
            widget: "list"
            field: { name: "paragraph", label: "Paragraph Text", widget: "text" }

          # ---------- THREE SQUARE BANNER LINKS ----------
          - { name: "banner_1_image", label: "Banner 1 — Image", widget: "image" }
          - { name: "banner_1_title", label: "Banner 1 — Title", widget: "string" }
          - { name: "banner_1_link", label: "Banner 1 — URL Link", widget: "string" }

          - { name: "banner_2_image", label: "Banner 2 — Image", widget: "image" }
          - { name: "banner_2_title", label: "Banner 2 — Title", widget: "string" }
          - { name: "banner_2_link", label: "Banner 2 — URL Link", widget: "string" }

          - { name: "banner_3_image", label: "Banner 3 — Image", widget: "image" }
          - { name: "banner_3_title", label: "Banner 3 — Title", widget: "string" }
          - { name: "banner_3_link", label: "Banner 3 — URL Link", widget: "string" }

          # ---------- RECENT STORIES / BLOG GRID ----------
          - { name: "stories_heading", label: "Recent Stories — Section Heading", widget: "string" }
          - name: "featured_stories"
            label: "Featured Stories Grid"
            widget: "list"
            fields:
              - { name: "title", label: "Story Title", widget: "string" }
              - { name: "subtitle", label: "Story Subtitle/Location", widget: "string" }
              - { name: "image", label: "Story Cover Image", widget: "image" }
              - { name: "link", label: "Story URL Link", widget: "string" }

          # ---------- REVIEWS SLIDER ----------
          - name: "testimonials"
            label: "Client Testimonials Slider"
            widget: "list"
            fields:
              - { name: "quote", label: "Client Quote", widget: "text" }
              - { name: "author", label: "Client Name(s)", widget: "string" }

  - name: "about_page"
    label: "About Page"
    files:
      - name: "content"
        label: "About Page Content"
        file: "src/content/about.json"
        editor:
          preview: false
        fields:
          - { name: "header_eyebrow", label: "Header — small text above title", widget: "string" }
          - { name: "header_heading", label: "Header — Page Title", widget: "string" }
          - { name: "header_intro", label: "Header — Intro Paragraph", widget: "text" }
          - { name: "bio_image_1", label: "Bio Image 1", widget: "image" }
          - { name: "bio_image_2", label: "Bio Image 2", widget: "image" }
          - name: "bio_paragraphs"
            label: "Bio Paragraphs"
            widget: "list"
            field: { name: "paragraph", label: "Paragraph", widget: "text" }
          - { name: "fun_facts_heading", label: "Fun Facts Heading", widget: "string" }
          - name: "fun_facts"
            label: "Fun Facts List"
            widget: "list"
            field: { name: "fact", label: "Fact Text", widget: "string" }

  - name: "portfolio_senior_portraits"
    label: "Portfolio - Senior Portraits"
    files:
      - name: "content"
        label: "Senior Portraits Content"
        file: "src/content/portfolio-senior-portraits.json"
        editor:
          preview: false
        fields:
          - { name: "header_eyebrow", label: "Header — small text above title", widget: "string" }
          - { name: "header_heading", label: "Header — Page Title", widget: "string" }
          - { name: "header_intro", label: "Header — Intro Paragraph", widget: "text" }
          - { name: "cta_text", label: "CTA Box Text", widget: "string" }
          - name: "story_sets"
            label: "Featured Sessions (3 Sessions of 6 Images)"
            widget: "list"
            summary: "{{fields.set_title}}"
            fields:
              - { name: "set_title", label: "Session Title", widget: "string" }
              - name: "images"
                label: "Session Images (Up to 6)"
                widget: "list"
