backend:
  name: github
  repo: jakefixestech/meredith-lewis-photography
  branch: main
  base_url: https://meredithlewisphotography.com
  auth_endpoint: /api/auth

media_folder: "src/assets/uploads"
public_folder: "/src/assets/uploads"

collections:
  - name: "homepage"
    label: "Home Page"
    files:
      - name: "content"
        label: "Home Page Content"
        file: "src/content/homepage.json"
        editor:
          preview: false
        fields:
          # ---------- HERO ----------
          - { name: "hero_image", label: "Hero — Background Image (top banner)", widget: "image" }
          - { name: "hero_image_alt", label: "Hero Image — description for screen readers", widget: "string" }
          - { name: "hero_heading", label: "Hero — Heading Text", widget: "text" }

          # ---------- ABOUT / WELCOME ----------
          - { name: "about_eyebrow", label: "About — small text above heading", widget: "string" }
          - { name: "about_heading", label: "About — Heading", widget: "string" }
          - { name: "about_photo", label: "About — Your Photo", widget: "image" }
          - { name: "about_photo_alt", label: "About Photo — description for screen readers", widget: "string" }
          - name: "about_paragraphs"
            label: "About — Paragraphs"
            widget: "list"
            field: { name: "paragraph", label: "Paragraph Text", widget: "text" }

          # ---------- PORTFOLIO / GALLERY TILES ----------
          - { name: "portfolio_eyebrow", label: "Portfolio — small text above heading", widget: "string" }
          - { name: "portfolio_heading", label: "Portfolio — Heading", widget: "string" }
          - { name: "portfolio_blurb", label: "Portfolio — Short Description", widget: "text" }
          - name: "galleries"
            label: "Portfolio — Gallery Tiles"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { name: "title", label: "Tile Title", widget: "string" }
              - { name: "img", label: "Tile Image", widget: "image" }
              - { name: "alt", label: "Tile Image — description for screen readers", widget: "string" }
              - { name: "href", label: "Tile Link (do not change — controls page layout)", widget: "hidden" }
              - { name: "span", label: "Tile Size (do not change — controls page layout)", widget: "hidden" }
              - { name: "ratio", label: "Tile Aspect Ratio (do not change — controls page layout)", widget: "hidden" }

          # ---------- SERVICES & PRICING ----------
          - { name: "services_eyebrow", label: "Services — small text above heading", widget: "string" }
          - { name: "services_heading", label: "Services — Heading", widget: "string" }
          - { name: "services_blurb", label: "Services — Short Description", widget: "text" }
          - name: "services"
            label: "Services — Pricing List"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - { name: "name", label: "Session Type", widget: "string" }
              - { name: "price", label: "Price", widget: "string" }
          - { name: "services_footnote", label: "Services — Footnote Text", widget: "text" }

          # ---------- PAY WHAT YOU CAN MINI SESSIONS BAND ----------
          - { name: "minis_eyebrow", label: "Mini Sessions — small text above heading", widget: "string" }
          - { name: "minis_heading", label: "Mini Sessions — Heading", widget: "string" }
          - { name: "minis_body_before", label: "Mini Sessions — Paragraph (text before highlighted phrase)", widget: "text" }
          - { name: "minis_body_emphasis", label: "Mini Sessions — Highlighted Phrase", widget: "string" }
          - { name: "minis_body_after", label: "Mini Sessions — Paragraph (text after highlighted phrase)", widget: "text" }
          - { name: "minis_button_label", label: "Mini Sessions — Button Text", widget: "string" }
          - { name: "minis_button_href", label: "Mini Sessions — Button Link (do not change)", widget: "hidden" }

          # ---------- REVIEWS SLIDER ----------
          - { name: "testimonials_eyebrow", label: "Testimonials — small text above heading", widget: "string" }
          - { name: "testimonials_heading", label: "Testimonials — Heading", widget: "string" }
          - name: "testimonials"
            label: "Client Testimonials Slider"
            widget: "list"
            summary: "{{fields.author}}"
            fields:
              - { name: "quote", label: "Client Quote", widget: "text" }
              - { name: "author", label: "Client Name(s)", widget: "string" }
          - { name: "testimonials_link_label", label: "Testimonials — Link Text", widget: "string" }
          - { name: "testimonials_link_href", label: "Testimonials — Link URL (do not change)", widget: "hidden" }

          # ---------- CLOSING CALL TO ACTION ----------
          - { name: "cta_image", label: "Closing CTA — Background Image", widget: "image" }
          - { name: "cta_image_alt", label: "Closing CTA Image — description for screen readers", widget: "string" }
          - { name: "cta_heading", label: "Closing CTA — Heading", widget: "string" }
          - { name: "cta_text", label: "Closing CTA — Paragraph Text", widget: "text" }
          - { name: "cta_button_label", label: "Closing CTA — Button Text", widget: "string" }
          - { name: "cta_button_href", label: "Closing CTA — Button Link (do not change)", widget: "hidden" }

  - name: "portfolio_page"
    label: "Portfolio Page (Main Landing)"
    files:
      - name: "content"
        label: "Portfolio Page Content"
